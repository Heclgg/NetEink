; PlatformIO 配置 —— 自画 ESP32-S2 板 + 微雪 1.54 寸三色电子墨水屏
;
; 硬件依据：docs/custom_esp32s2_schematic.svg（U1 = ESP32-S2，U6 = WS2812）
; 墨水屏引脚写在 lib/EPD1in54C/src/epdif.h，按原理图读出的 GPIO：
;   SCLK=12  MOSI=11  CS=6  DC=5  RST=4  BUSY=7  (MISO=10 占位)  LED=GPIO9
;
; COM9 是 ESP32-S2 的原生 USB CDC（VID:PID 303A:0002），不是串口桥，
; 因此必须打开 ARDUINO_USB_CDC_ON_BOOT，否则日志与烧录都不通。
;
; ---- 两个构建环境 ----
;   pio run                    默认 = esp32-s2-saola-1（调试版，双路日志全开）
;   pio run -e release         发布版：日志全部编译掉，Flash 更小
;   pio run -e release -t upload
;
; 调试版日志走 USB CDC(COM9) + UART0(GPIO43/44)；发布版里 logf/logLine
; 展开成空语句，连格式字符串都不进 Flash（见 include/log.h）。

[platformio]
default_envs = esp32-s2-saola-1

; ---- 公共编译宏：自定义段，两个 env 都用 ${flags.usb} 引用，避免抄两份 ----
[flags]
usb = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=0
; 板载 WS2812 总开关：0 = 彻底关掉（不初始化 RMT、不发送任何帧，
; 只把 GPIO9 拉成输出低电平）。想恢复呼吸/闪烁提示就把这里改成 1。
; 关掉后 setup 里不会再打印 [LED] ready，串口也不会再有 [LED] 行。
led = -DNETEINK_LED=0

[env:esp32-s2-saola-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s2-saola-1
framework = arduino

; ---- 原生 USB CDC：串口日志与烧录都走 COM9 ----
; ARDUINO_USB_MODE=0 = TinyUSB 原生 USB CDC（Serial -> USBSerial）。
; 不能填 1：那是 HWCDC / USB Serial-JTAG 模式，ESP32-S2 没有这个外设
;（只有 S3/C3 有），填 1 会编译报 'HWCDCSerial' was not declared。
build_flags =
    ${flags.usb}
    ${flags.led}
    -DCORE_DEBUG_LEVEL=3

; 配网二维码：纯 C 的轻量 QR 编码器（约 20KB Flash），无需联网即可生成
lib_deps =
    ricmoo/QRCode@^0.0.1

; 说明：不要加 -DBOARD_HAS_PSRAM 或 board_build.arduino.memory_type=qio_opi，
; 那是 ESP32-S3 (8MB Flash + OPI PSRAM) 的配置。ESP32-S2 是单核、无 OPI PSRAM。
; Flash 容量与分区表在下面「Flash 参数」段按实际贴片型号配置。

monitor_speed = 115200
monitor_port  = COM9
upload_port   = COM9

; ---- 上传参数：按「自画板 + 原生 USB CDC」保守设置 ----
; 1) 460800 会让 esptool 在上传 stub 后发一次「改波特率」命令。
;    原生 USB CDC 没有真实波特率，切换后容易失步/掉线（报错
;    "No more data to read from the serial port"）。用 115200 时
;    目标速率 == 连接速率，esptool 不会发起切换。
upload_speed  = 115200

; 2) Saola-1 板型默认是 qio + 80MHz，那是乐鑫官方板的 Flash 参数。
;    自画板 Flash 型号/走线未知，统一降到所有 NOR Flash 都支持的
;    DIO + 40MHz，牺牲一点启动速度换兼容性。
board_build.flash_mode = dio
board_build.f_flash    = 40000000L

; ---- Flash 参数：W25Q16JV / 25Q16（16 Mbit = 2 MB，3.3V）----
; default.csv 是按 4MB 画的（coredump 在 0x3F0000，末端 0x400000），
; 直接烧进 2MB Flash 会越界，必须换 2MB 布局。
;
; 分区表在项目根目录 partitions.csv（自带注释），2MB 布局：
;   nvs 20K / otadata 8K / app0 1.75MB / spiffs 128K / coredump 64K
; 和 Arduino 的 minimal.csv 相比，只是把 spiffs 从 640KB 收到 128KB
; （那里只用前 64KB 存「上一次传的图」），腾出的 512KB 全给了 app：
;   app 1.25MB -> 1.75MB，Flash 占用率从 ~91% 降到 ~65%
; 不设第二个 OTA 槽，适合这个电子纸 demo。
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv

; 若以后换成 W25Q32 (4MB)：把 flash_size 改回 4MB，并把 partitions 改成
; default.csv（或用 4MB 版的 csv）。代码不用动。
;
; 注意：spiffs 那块没有挂任何文件系统，src/photo_store.cpp 直接借它
; 最前面 64KB 存「上一次传的图」（8 个 8KB 槽轮着写，断电不丢）。哪天要改成
; LittleFS，记得把这段先让出来，否则会互相踩。

; 3) 若板子没有自动下载电路，上传卡在 Connecting... 时手动：
;    按住 BOOT(GPIO0) -> 点一下 RESET -> 松开 BOOT。

; ============================================================================
; 发布版：日志全部关闭
; ----------------------------------------------------------------------------
; extends 会继承 board / flash 参数 / lib_deps / 上传口，只覆盖 build_flags。
; -DNETEINK_LOG=0 让 include/log.h 里的 logf/logLine 展开成 (void)0，
;   格式字符串一并被丢弃；串口也不初始化，省掉 setup 里 800ms 等待。
; CORE_DEBUG_LEVEL=0 关掉 IDF 内核自己的调试打印（WiFi 协议栈等）。
; 烧录后用 `pio device monitor` 打开会是全空的，这是预期行为。
; ============================================================================
[env:release]
extends = env:esp32-s2-saola-1
build_flags =
    ${flags.usb}
    ${flags.led}
    -DCORE_DEBUG_LEVEL=0
    -DNETEINK_LOG=0
