; PlatformIO 配置 —— 自画 ESP32-S2 板 + 微雪 1.54 寸三色电子墨水屏
;
; 硬件依据：docs/custom_esp32s2_schematic.svg（U1 = ESP32-S2，U6 = WS2812）
; 墨水屏引脚写在 lib/EPD1in54C/src/epdif.h，按原理图读出的 GPIO：
;   SCLK=12  MOSI=11  CS=6  DC=5  RST=4  BUSY=7  (MISO=10 占位)  LED=GPIO9
;
; COM9 是 ESP32-S2 的原生 USB CDC（VID:PID 303A:0002），不是串口桥，
; 因此必须打开 ARDUINO_USB_CDC_ON_BOOT，否则日志与烧录都不通。

[platformio]
default_envs = esp32-s2-saola-1

[env:esp32-s2-saola-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s2-saola-1
framework = arduino

; ---- 原生 USB CDC：串口日志与烧录都走 COM9 ----
; ARDUINO_USB_MODE=0 = TinyUSB 原生 USB CDC（Serial -> USBSerial）。
; 不能填 1：那是 HWCDC / USB Serial-JTAG 模式，ESP32-S2 没有这个外设
;（只有 S3/C3 有），填 1 会编译报 'HWCDCSerial' was not declared。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=3

; 配网二维码：纯 C 的轻量 QR 编码器（约 20KB Flash），无需联网即可生成
lib_deps =
    ricmoo/QRCode@^0.0.1

; 说明：不要加 -DBOARD_HAS_PSRAM 或 board_build.arduino.memory_type=qio_opi，
; 那是 ESP32-S3 (8MB Flash + OPI PSRAM) 的配置。ESP32-S2 是单核、无 OPI PSRAM。
; Flash 容量与分区表在下面「Flash 参数」段按实际贴片型号配置。

monitor_speed = 115200
monitor_port  = COM9
upload_port   = COM9

; ---- 上传参数：按「自画板 + 原生 USB CDC」保守设置 ----
; 1) 460800 会让 esptool 在上传 stub 后发一次「改波特率」命令。
;    原生 USB CDC 没有真实波特率，切换后容易失步/掉线（报错
;    "No more data to read from the serial port"）。用 115200 时
;    目标速率 == 连接速率，esptool 不会发起切换。
upload_speed  = 115200

; 2) Saola-1 板型默认是 qio + 80MHz，那是乐鑫官方板的 Flash 参数。
;    自画板 Flash 型号/走线未知，统一降到所有 NOR Flash 都支持的
;    DIO + 40MHz，牺牲一点启动速度换兼容性。
board_build.flash_mode = dio
board_build.f_flash    = 40000000L

; ---- Flash 参数：W25Q16JV / 25Q16（16 Mbit = 2 MB，3.3V）----
; 容量核算：firmware.bin 约 332 KB，2MB 布局里 app 槽 1.25 MB，余量充足。
; 但平台默认分区表 default.csv 是按 4MB 画的（coredump 在 0x3F0000，
; 末端 0x400000），直接烧进 2MB Flash 会越界，必须换成 2MB 布局。
; minimal.csv 是 Arduino-ESP32 自带的 2MB 分区表：
;   nvs / otadata / app0(1.25MB) / spiffs(640KB) / coredump
; 末端正好 0x200000 = 2MB，不设第二个 OTA app，适合这个电子纸 demo。
board_upload.flash_size = 2MB
board_build.partitions  = minimal.csv

; 若以后换成 W25Q32 (4MB)：把 flash_size 改回 4MB，并删掉 partitions 行
;（或显式写 board_build.partitions = default.csv）。改这两处即可，代码不用动。

; 3) 若板子没有自动下载电路，上传卡在 Connecting... 时手动：
;    按住 BOOT(GPIO0) -> 点一下 RESET -> 松开 BOOT。
